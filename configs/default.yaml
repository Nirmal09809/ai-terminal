provider: gemini

providers:
  gemini:
    api_key: ""
    model: "gemini-2.0-flash"
    temperature: 0.7
    max_tokens: 8192
    grounding: true

  openai:
    api_key: ""
    base_url: "https://api.openai.com/v1"
    model: "gpt-4o"
    temperature: 0.7
    max_tokens: 8192

  anthropic:
    api_key: ""
    base_url: "https://api.anthropic.com"
    model: "claude-3-5-sonnet-20241022"
    temperature: 0.7
    max_tokens: 8192

  ollama:
    url: "http://localhost:11434"
    model: "llama3"
    timeout: 120

  vertex:
    project_id: ""
    location: "us-central1"
    model: "gemini-2.0-flash"
    credentials: ""

tools:
  shell:
    enabled: true
    allowed_commands: []
    blocked_commands:
      - rm -rf /
      - dd if=
      - mkfs
      - :(){:|:&};:
    timeout: 30
    max_output_size: 1048576

  web:
    enabled: true
    user_agent: "ai-terminal/1.0"
    timeout: 30
    max_retries: 3

  file:
    allowed_dirs: []
    blocked_dirs:
      - /sys
      - /proc
      - /dev
    max_file_size: 10485760

session:
  storage_dir: "~/.ai-terminal/sessions"
  max_history: 100
  auto_save: true
  save_interval: 60

context:
  max_tokens: 128000
  strategy: "sliding"
  sliding_window: 10

mcp:
  enabled: false
  servers: []

ui:
  theme: "dark"
  streaming: true
  color_256: true
  show_typing: true
  max_width: 80

security:
  sandbox: true
  rate_limit: 60
  audit_log: true

log:
  level: "info"
  file: ""
  format: "text"
